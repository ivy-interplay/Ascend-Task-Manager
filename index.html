<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager V02</title><style>*{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}body{margin:0;background:#0f172a;color:#e2e8f0}header{padding:16px 24px;background:#111827;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}#board{display:flex;gap:16px;padding:24px;overflow-x:auto}.col{background:#1e293b;border-radius:12px;min-width:280px;flex:1;padding:12px;display:flex;flex-direction:column}.col h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin:4px 8px 12px}.col-count{background:#334155;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:6px;color:#cbd5e1}.cards{flex:1;min-height:40px}.card{background:#334155;border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;border-left:4px solid #38bdf8;transition:background .15s}.card:hover{background:#3d4f6a}.card .t{font-weight:600;font-size:14px}.card .d{font-size:12px;color:#cbd5e1;margin-top:4px;white-space:pre-wrap}.card .m{font-size:11px;color:#94a3b8;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}.add{background:none;border:1px dashed #475569;color:#94a3b8;border-radius:8px;padding:8px;cursor:pointer;width:100%}.add:hover{border-color:#38bdf8;color:#38bdf8}button.primary{background:#38bdf8;color:#0f172a;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}button.primary:hover{background:#7dd3fc}#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}#modal.open{display:flex}.dlg{background:#1e293b;border-radius:14px;padding:24px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto}.dlg label{display:block;font-size:12px;color:#94a3b8;margin:12px 0 4px}.dlg input,.dlg textarea,.dlg select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:8px;font-size:14px}.row{display:flex;gap:12px}.row>div{flex:1}.actions{display:flex;justify-content:space-between;margin-top:20px}.del{background:none;border:none;color:#f87171;cursor:pointer}.log-section{margin-top:20px;border-top:1px solid #334155;padding-top:16px}.log-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin:0 0 10px}.log-entry{font-size:12px;color:#cbd5e1;padding:6px 0;border-bottom:1px solid #1e293b}.log-entry .ts{color:#64748b;font-size:11px}.log-entry .src{color:#38bdf8;font-size:11px;margin-left:6px}.log-entry .txt{margin-top:2px}.add-note{display:flex;gap:8px;margin-top:8px}.add-note input{flex:1}.loading{text-align:center;color:#64748b;padding:40px}.error-msg{color:#f87171;font-size:13px;margin:4px 0}</style></head><body>
<header><h1>&#128203; Task Manager V02</h1><button class="primary" onclick="openModal()">+ New Task</button></header>
<div id="board"><div class="loading">Loading&#8230;</div></div>
<div id="modal"><div class="dlg">
  <input type="hidden" id="f-id">
  <label>Title</label><input id="f-title" placeholder="Task title">
  <label>Description</label><textarea id="f-desc" rows="3" placeholder="What needs to be done?"></textarea>
  <div class="row"><div><label>Owner</label><input id="f-owner" placeholder="Name or email"></div><div><label>Status</label><select id="f-status"><option value="todo">To Do</option><option value="prog">In Progress</option><option value="done">Done</option></select></div></div>
  <label>Watchers (comma-separated)</label><input id="f-watch" placeholder="Names or emails">
  <div id="modal-error" class="error-msg" style="display:none"></div>
  <div class="actions"><button class="del" id="del-btn" onclick="delTask()" style="display:none">Delete</button><div><button onclick="closeModal()">Cancel</button> <button class="primary" onclick="saveTask()">Save</button></div></div>
  <div class="log-section" id="log-section" style="display:none">
    <h3>Update Log</h3>
    <div id="log-entries"></div>
    <div class="add-note"><input id="note-input" placeholder="Add a note&#8230;" onkeydown="if(event.key==='Enter')addNote()"><button class="primary" onclick="addNote()">Add</button></div>
  </div>
</div></div>
<script>
const SB_URL='https://zeulzsabpijbdmjitysk.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpldWx6c2FicGlqYmRtaml0eXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzE4MDcsImV4cCI6MjA5MTI0NzgwN30.g5R7Ctq0J6XJ7kZgsJ5JM2Bld7UDzS7IMFe-_g9WYfg';
const HDR={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const COLS=[['todo','To Do'],['prog','In Progress'],['done','Done']];

let cards=[];

async function sbGet(table,query=''){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?'+query,{headers:HDR});
  if(!r.ok)throw new Error('GET '+table+' '+r.status);
  return r.json();
}
async function sbPost(table,body){
  const r=await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:HDR,body:JSON.stringify(body)});
  if(!r.ok)throw new Error('POST '+table+' '+r.status);
  return r.json();
}
async function sbPatch(table,id,body){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('PATCH '+table+' '+r.status);
  return r.json();
}
async function sbDelete(table,id){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id,{method:'DELETE',headers:HDR});
  if(!r.ok)throw new Error('DELETE '+table+' '+r.status);
}

async function loadCards(){
  try{
    cards=await sbGet('tm2_cards','order=created_at.asc');
  }catch(e){
    console.warn('Supabase unavailable, using localStorage:',e.message);
    cards=JSON.parse(localStorage.getItem('tm2_cards')||'[]');
  }
  render(cards);
}

function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(data){
  const b=document.getElementById('board');
  b.innerHTML='';
  COLS.forEach(([k,name])=>{
    const col=document.createElement('div');
    col.className='col';
    const group=data.filter(c=>c.status===k);
    col.innerHTML='<h2>'+name+'<span class="col-count">'+group.length+'</span></h2>';
    const cc=document.createElement('div');
    cc.className='cards';
    cc.dataset.col=k;
    group.forEach(c=>{
      const el=document.createElement('div');
      el.className='card';
      el.dataset.id=c.id;
      el.onclick=()=>openModal(c.id);
      el.innerHTML='<div class="t">'+esc(c.title)+'</div>'
        +(c.desc?'<div class="d">'+esc(c.desc)+'</div>':'')
        +'<div class="m">'
        +(c.owner?'<span>&#128100; '+esc(c.owner)+'</span>':'')
        +(c.watchers?'<span>&#128065; '+esc(c.watchers)+'</span>':'')
        +'</div>';
      cc.appendChild(el);
    });
    col.appendChild(cc);
    const a=document.createElement('button');
    a.className='add';
    a.textContent='+ Add task';
    a.onclick=()=>openModal(null,k);
    col.appendChild(a);
    b.appendChild(col);
  });
}

function openModal(id,col){
  const m=document.getElementById('modal');
  m.classList.add('open');
  document.getElementById('modal-error').style.display='none';
  const c=cards.find(x=>x.id===id)||{};
  document.getElementById('f-id').value=id||'';
  document.getElementById('f-title').value=c.title||'';
  document.getElementById('f-desc').value=c.desc||'';
  document.getElementById('f-owner').value=c.owner||'';
  document.getElementById('f-watch').value=c.watchers||'';
  document.getElementById('f-status').value=c.status||col||'todo';
  document.getElementById('del-btn').style.display=id?'':'none';
  const ls=document.getElementById('log-section');
  if(id){
    ls.style.display='';
    loadLog(id);
  }else{
    ls.style.display='none';
  }
}

async function loadLog(cardId){
  const el=document.getElementById('log-entries');
  el.innerHTML='<div style="color:#64748b;font-size:12px">Loading&#8230;</div>';
  try{
    const logs=await sbGet('tm2_updates','card_id=eq.'+cardId+'&order=created_at.asc');
    if(!logs.length){el.innerHTML='<div style="color:#64748b;font-size:12px">No updates yet.</div>';return;}
    el.innerHTML=logs.map(l=>'<div class="log-entry"><span class="ts">'+new Date(l.created_at).toLocaleString()+'</span>'+(l.source?'<span class="src">['+esc(l.source)+']</span>':'')+'<div class="txt">'+esc(l.content)+'</div></div>').join('');
  }catch(e){
    el.innerHTML='<div style="color:#64748b;font-size:12px">Update log unavailable.</div>';
  }
}

async function addNote(){
  const cardId=document.getElementById('f-id').value;
  const input=document.getElementById('note-input');
  const txt=(input.value||'').trim();
  if(!txt||!cardId)return;
  try{
    await sbPost('tm2_updates',{card_id:cardId,content:txt,source:'manual'});
    input.value='';
    loadLog(cardId);
  }catch(e){showError('Could not save note: '+e.message);}
}

function showError(msg){
  const el=document.getElementById('modal-error');
  el.textContent=msg;
  el.style.display='';
}

function closeModal(){document.getElementById('modal').classList.remove('open')}

async function saveTask(){
  const id=document.getElementById('f-id').value;
  const title=(document.getElementById('f-title').value||'').trim();
  if(!title){showError('Title is required.');return;}
  const body={
    title:title,
    desc:(document.getElementById('f-desc').value||'').trim(),
    owner:(document.getElementById('f-owner').value||'').trim(),
    watchers:(document.getElementById('f-watch').value||'').trim(),
    status:document.getElementById('f-status').value
  };
  try{
    if(id){
      const rows=await sbPatch('tm2_cards',id,body);
      const updated=Array.isArray(rows)?rows[0]:rows;
      const idx=cards.findIndex(c=>c.id===id);
      if(idx>=0)cards[idx]={...cards[idx],...updated};
    }else{
      const rows=await sbPost('tm2_cards',body);
      const created=Array.isArray(rows)?rows[0]:rows;
      cards.push(created);
    }
    closeModal();
    render(cards);
  }catch(e){
    // fallback to localStorage
    if(id){
      const idx=cards.findIndex(c=>c.id===id);
      if(idx>=0)cards[idx]={...cards[idx],...body};
    }else{
      cards.push({...body,id:Date.now().toString(),created_at:new Date().toISOString()});
    }
    localStorage.setItem('tm2_cards',JSON.stringify(cards));
    closeModal();
    render(cards);
  }
}

async function delTask(){
  const id=document.getElementById('f-id').value;
  if(!id)return;
  try{await sbDelete('tm2_cards',id);}catch(e){/* best-effort */}
  cards=cards.filter(c=>c.id!==id);
  localStorage.setItem('tm2_cards',JSON.stringify(cards));
  closeModal();
  render(cards);
}

loadCards();
</script></body></html>
