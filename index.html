<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager V02</title><style>*{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}body{margin:0;background:#0f172a;color:#e2e8f0}header{padding:16px 24px;background:#111827;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}#board{display:flex;gap:16px;padding:24px;overflow-x:auto}.col{background:#1e293b;border-radius:12px;min-width:280px;flex:1;padding:12px;display:flex;flex-direction:column}.col h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin:4px 8px 12px}.cards{flex:1;min-height:40px}.card{background:#334155;border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab;border-left:4px solid #38bdf8}.card.p-high{border-left-color:#f87171}.card.p-med{border-left-color:#fbbf24}.card.p-low{border-left-color:#4ade80}.card .t{font-weight:600;font-size:14px}.card .d{font-size:12px;color:#cbd5e1;margin-top:4px}.card .m{font-size:11px;color:#94a3b8;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}.add{background:none;border:1px dashed #475569;color:#94a3b8;border-radius:8px;padding:8px;cursor:pointer;width:100%}.add:hover{border-color:#38bdf8;color:#38bdf8}button.primary{background:#38bdf8;color:#0f172a;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}#modal.open{display:flex}.dlg{background:#1e293b;border-radius:14px;padding:24px;width:420px;max-width:92vw}.dlg label{display:block;font-size:12px;color:#94a3b8;margin:12px 0 4px}.dlg input,.dlg textarea,.dlg select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:8px}.row{display:flex;gap:12px}.row>div{flex:1}.actions{display:flex;justify-content:space-between;margin-top:20px}.del{background:none;border:none;color:#f87171;cursor:pointer}</style></head><body><header><h1>📋 Task Manager V02</h1><button class="primary" onclick="openModal()">+ New Task</button></header><div id="board"></div><div id="modal"><div class="dlg"><input type="hidden" id="f-id"><label>Title</label><input id="f-title"><label>Description</label><textarea id="f-desc" rows=3></textarea><div class="row"><div><label>Owner</label><input id="f-owner"></div><div><label>Priority</label><select id="f-pri"><option value=low>Low</option><option value=med selected>Medium</option><option value=high>High</option></select></div></div><div class="row"><div><label>Watchers (comma-separated)</label><input id="f-watch"></div><div><label>Due date</label><input id="f-due" type=date></div></div><label>Status</label><select id="f-status"><option value=todo>To Do</option><option value=prog>In Progress</option><option value=review>Review</option><option value=done>Done</option></select><div class="actions"><button class="del" onclick="delTask()">Delete</button><div><button onclick="closeModal()">Cancel</button> <button class="primary" onclick="saveTask()">Save</button></div></div></div></div><script>const COLS=[['todo','To Do'],['prog','In Progress'],['review','Review'],['done','Done']];let tasks=JSON.parse(localStorage.getItem('tm2')||'[]');function save(){localStorage.setItem('tm2',JSON.stringify(tasks));render()}function render(){const b=document.getElementById('board');b.innerHTML='';COLS.forEach(([k,name])=>{const c=document.createElement('div');c.className='col';c.innerHTML=`<h2>${name}</h2>`;const cc=document.createElement('div');cc.className='cards';cc.dataset.col=k;cc.ondragover=e=>e.preventDefault();cc.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('id');const t=tasks.find(x=>x.id==id);if(t){t.status=k;save()}};tasks.filter(t=>t.status==k).forEach(t=>{const el=document.createElement('div');el.className='card p-'+t.pri;el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData('id',t.id);el.onclick=()=>openModal(t.id);el.innerHTML=`<div class=t>${esc(t.title)}</div>${t.desc?`<div class=d>${esc(t.desc)}</div>`:''}<div class=m>${t.owner?`👤 ${esc(t.owner)}`:''}${t.watchers?`👁 ${esc(t.watchers)}`:''}${t.due?`📅 ${t.due}`:''}</div>`;cc.appendChild(el)});c.appendChild(cc);const a=document.createElement('button');a.className='add';a.textContent='+ Add';a.onclick=()=>openModal(null,k);c.appendChild(a);b.appendChild(c)})}function esc(s){return(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function openModal(id,col){document.getElementById('modal').classList.add('open');const t=tasks.find(x=>x.id==id)||{};document.getElementById('f-id').value=id||'';document.getElementById('f-title').value=t.title||'';document.getElementById('f-desc').value=t.desc||'';document.getElementById('f-owner').value=t.owner||'';document.getElementById('f-watch').value=t.watchers||'';document.getElementById('f-due').value=t.due||'';document.getElementById('f-pri').value=t.pri||'med';document.getElementById('f-status').value=t.status||col||'todo'}function closeModal(){document.getElementById('modal').classList.remove('open')}function saveTask(){const id=document.getElementById('f-id').value;const o={id:id||Date.now(),title:document.getElementById('f-title').value||'Untitled',desc:document.getElementById('f-desc').value,owner:document.getElementById('f-owner').value,watchers:document.getElementById('f-watch').value,due:document.getElementById('f-due').value,pri:document.getElementById('f-pri').value,status:document.getElementById('f-status').value};if(id){Object.assign(tasks.find(x=>x.id==id),o)}else{tasks.push(o)}closeModal();save()}function delTask(){const id=document.getElementById('f-id').value;tasks=tasks.filter(x=>x.id!=id);closeModal();save()}render()</script></body></html>
